# Incluido dentro del contexto http{} de nginx (conf.d/*.conf).

# Connection: upgrade solo cuando el cliente pide upgrade (websocket);
# "close" para requests normales proxiadas.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── /api → backend (dual-mount: se pasa el path tal cual, sin strip) ──────
    # resolver + variable: nginx resuelve "backend" perezosamente, así la
    # imagen arranca aunque el backend no exista (p.ej. docker run suelto).
    # 127.0.0.11 = DNS interno de Docker en redes de compose.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $bes_backend http://backend:9000;
        proxy_pass $bes_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sockets de streaming de larga vida + frames binarios sin buffering
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # POST binarios de /simulations/custom (default de nginx: 1m)
        client_max_body_size 64m;
    }

    # Assets con hash de Rsbuild: cache inmutable
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El HTML nunca se cachea fuerte, para que cada deploy se vea al recargar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (react-router con BrowserRouter): rutas profundas como
    # /board/simulation/:runId deben resolver a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
